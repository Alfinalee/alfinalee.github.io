<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#ffffff"] { fill: #18181b; }
      [fill="#222"] { fill: #ececec; }
      [fill="#333"], [fill="#444"] { fill: #c9c9c9; }
      [fill="#555"], [fill="#666"], [fill="#777"] { fill: #a3a3a3; }
      [stroke="#555"] { stroke: #a3a3a3; }
      [stroke="#bbb"], [stroke="#999"] { stroke: #52525b; }
      [stroke="#fff"] { stroke: #18181b; }
      rect[fill="#fff"] { fill: #27272a; }
      [fill="#f4f3ef"] { fill: #27272a; }
      [fill="#eeeeee"] { fill: #27272a; }
      [fill="#eef3fb"] { fill: #1d2a3f; }
      [fill="#dfe8f8"] { fill: #263652; }
      [fill="#efeafc"] { fill: #2a2443; }
      [fill="#e4f4ee"] { fill: #1b332d; }
      [fill="#fdf2de"] { fill: #3a2e17; }
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="720" height="800" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#222">What happens inside an LLM, one token at a time</text>

  <!-- prompt -->
  <rect x="110" y="65" width="440" height="56" rx="10" fill="#f4f3ef" stroke="#bbb"/>
  <text x="330" y="87" text-anchor="middle" font-size="12" fill="#777">Your prompt</text>
  <text x="330" y="110" text-anchor="middle" font-size="17" fill="#222">“a fluffy black cat”</text>
  <line x1="330" y1="121" x2="330" y2="147" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- tokenize -->
  <rect x="110" y="150" width="440" height="70" rx="10" fill="#f4f3ef" stroke="#bbb"/>
  <text x="330" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Tokenize</text>
  <g font-size="14" fill="#222" text-anchor="middle">
    <rect x="191" y="184" width="40" height="26" rx="6" fill="#fff" stroke="#999"/><text x="211" y="202">a</text>
    <rect x="241" y="184" width="80" height="26" rx="6" fill="#fff" stroke="#999"/><text x="281" y="202">fluffy</text>
    <rect x="331" y="184" width="72" height="26" rx="6" fill="#fff" stroke="#999"/><text x="367" y="202">black</text>
    <rect x="413" y="184" width="56" height="26" rx="6" fill="#fff" stroke="#999"/><text x="441" y="202">cat</text>
  </g>
  <line x1="330" y1="220" x2="330" y2="247" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- embedding -->
  <rect x="110" y="250" width="440" height="70" rx="10" fill="#eef3fb" stroke="#6b8fd1" stroke-width="1.5"/>
  <text x="330" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#222">1 · Embedding</text>
  <text x="330" y="301" text-anchor="middle" font-size="13" fill="#444">each token becomes a vector of thousands of numbers</text>
  <line x1="330" y1="320" x2="330" y2="347" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- layers group -->
  <rect x="90" y="350" width="480" height="200" rx="14" fill="none" stroke="#999" stroke-dasharray="6 5"/>
  <text x="556" y="371" text-anchor="end" font-size="12" fill="#777">repeated × N layers (dozens)</text>

  <rect x="110" y="380" width="440" height="64" rx="10" fill="#efeafc" stroke="#8b7bd8" stroke-width="1.5"/>
  <text x="330" y="405" text-anchor="middle" font-size="16" font-weight="700" fill="#222">2 · Attention</text>
  <text x="330" y="428" text-anchor="middle" font-size="13" fill="#444">vectors ask each other questions and share meaning</text>
  <line x1="330" y1="444" x2="330" y2="467" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="110" y="470" width="440" height="64" rx="10" fill="#e4f4ee" stroke="#3fa58a" stroke-width="1.5"/>
  <text x="330" y="495" text-anchor="middle" font-size="16" font-weight="700" fill="#222">3 · MLP</text>
  <text x="330" y="518" text-anchor="middle" font-size="13" fill="#444">each vector picks up extra knowledge</text>
  <line x1="330" y1="550" x2="330" y2="577" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- unembedding -->
  <rect x="110" y="580" width="440" height="118" rx="10" fill="#fdf2de" stroke="#d9a13b" stroke-width="1.5"/>
  <text x="330" y="604" text-anchor="middle" font-size="16" font-weight="700" fill="#222">4 · Unembedding + softmax</text>
  <text x="330" y="625" text-anchor="middle" font-size="13" fill="#444">the last vector → a probability for every possible next token</text>
  <g font-size="13" fill="#222">
    <text x="215" y="648" text-anchor="end">sat</text>
    <rect x="222" y="638" width="164" height="12" rx="2" fill="#d9a13b"/>
    <text x="392" y="648">0.41</text>
    <text x="215" y="667" text-anchor="end">is</text>
    <rect x="222" y="657" width="72" height="12" rx="2" fill="#e6bf7a"/>
    <text x="300" y="667">0.18</text>
    <text x="215" y="686" text-anchor="end">was</text>
    <rect x="222" y="676" width="48" height="12" rx="2" fill="#efd5a6"/>
    <text x="276" y="686">0.12   …</text>
  </g>
  <line x1="330" y1="698" x2="330" y2="725" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- pick -->
  <rect x="110" y="728" width="440" height="50" rx="10" fill="#f4f3ef" stroke="#bbb"/>
  <text x="330" y="759" text-anchor="middle" font-size="16" font-weight="700" fill="#222">Pick one token → “sat”</text>

  <!-- loop -->
  <path d="M550,753 H640 V93 H553" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text transform="translate(662,423) rotate(-90)" text-anchor="middle" font-size="13" fill="#555">append “sat” to the input and run everything again, until a “stop” token</text>
</svg>
