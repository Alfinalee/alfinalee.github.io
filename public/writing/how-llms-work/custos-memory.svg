<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#ffffff"] { fill: #18181b; }
      [fill="#222"] { fill: #ececec; }
      [fill="#333"], [fill="#444"] { fill: #c9c9c9; }
      [fill="#555"], [fill="#666"], [fill="#777"] { fill: #a3a3a3; }
      [stroke="#555"] { stroke: #a3a3a3; }
      [stroke="#bbb"], [stroke="#999"] { stroke: #52525b; }
      [stroke="#fff"] { stroke: #18181b; }
      rect[fill="#fff"] { fill: #27272a; }
      [fill="#f4f3ef"] { fill: #27272a; }
      [fill="#eeeeee"] { fill: #27272a; }
      [fill="#eef3fb"] { fill: #1d2a3f; }
      [fill="#dfe8f8"] { fill: #263652; }
      [fill="#efeafc"] { fill: #2a2443; }
      [fill="#e4f4ee"] { fill: #1b332d; }
      [fill="#fdf2de"] { fill: #3a2e17; }
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">How Custos will remember me</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#777">The model never changes. Memory lives outside it, and the right pieces go into the context.</text>

  <!-- my message -->
  <rect x="40" y="90" width="190" height="60" rx="10" fill="#f4f3ef" stroke="#bbb"/>
  <text x="135" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#222">My message</text>
  <text x="135" y="138" text-anchor="middle" font-size="13" fill="#555">“Should I take this job?”</text>

  <!-- memory store cylinder -->
  <path d="M40,270 V410 A95,16 0 0 0 230,410 V270" fill="#eef3fb" stroke="#6b8fd1" stroke-width="1.5"/>
  <ellipse cx="135" cy="270" rx="95" ry="16" fill="#dfe8f8" stroke="#6b8fd1" stroke-width="1.5"/>
  <text x="135" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Memory store</text>
  <text x="135" y="328" text-anchor="middle" font-size="12" fill="#777">outside the model</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="135" y="356">facts about me</text>
    <text x="135" y="376">past conversations</text>
    <text x="135" y="396">how I’ve changed</text>
  </g>

  <!-- retrieval -->
  <rect x="300" y="200" width="190" height="90" rx="10" fill="#efeafc" stroke="#8b7bd8" stroke-width="1.5"/>
  <text x="395" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Retrieval (RAG)</text>
  <text x="395" y="254" text-anchor="middle" font-size="13" fill="#444">embed the message,</text>
  <text x="395" y="272" text-anchor="middle" font-size="13" fill="#444">find the closest memories</text>

  <!-- context window -->
  <rect x="560" y="80" width="200" height="130" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="660" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Context window</text>
  <rect x="580" y="120" width="160" height="32" rx="6" fill="#f4f3ef" stroke="#bbb"/>
  <text x="660" y="141" text-anchor="middle" font-size="13" fill="#222">my message</text>
  <rect x="580" y="162" width="160" height="32" rx="6" fill="#eef3fb" stroke="#6b8fd1"/>
  <text x="660" y="183" text-anchor="middle" font-size="13" fill="#222">relevant memories</text>

  <!-- LLM -->
  <rect x="560" y="270" width="200" height="80" rx="10" fill="#fdf2de" stroke="#d9a13b" stroke-width="1.5"/>
  <text x="660" y="299" text-anchor="middle" font-size="16" font-weight="700" fill="#222">LLM</text>
  <text x="660" y="321" text-anchor="middle" font-size="12" fill="#444">knobs fixed: knows the world,</text>
  <text x="660" y="337" text-anchor="middle" font-size="12" fill="#444">not me</text>

  <!-- answer -->
  <rect x="790" y="285" width="90" height="50" rx="10" fill="#f4f3ef" stroke="#bbb"/>
  <text x="835" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Answer</text>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="230" y1="120" x2="557" y2="120"/>
    <line x1="200" y1="150" x2="328" y2="197"/>
    <line x1="230" y1="330" x2="298" y2="268"/>
    <line x1="490" y1="235" x2="598" y2="213"/>
    <line x1="660" y1="210" x2="660" y2="267"/>
    <line x1="760" y1="310" x2="787" y2="310"/>
    <path d="M835,335 V448 H135 V430" stroke-dasharray="5 4"/>
  </g>
  <text x="485" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#666">new important changes get written back to memory</text>
</svg>
